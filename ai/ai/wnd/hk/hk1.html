<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日贺卡生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "微软雅黑", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      color: #ff5e7d;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #fecfef;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ff5e7d;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    #generateBtn {
      background: #ff5e7d;
      color: white;
    }

    #generateBtn:hover {
      background: #ff3d63;
    }

    #copyBtn {
      background: #64b5f6;
      color: white;
    }

    #copyBtn:hover {
      background: #42a5f5;
    }

    /* 贺卡样式 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      border: 3px solid #ff5e7d;
      display: none;
    }

    .card h2 {
      color: #ff5e7d;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .card-content {
      font-size: 18px;
      line-height: 1.8;
      color: #444;
      margin: 20px 0;
    }

    .wish {
      font-size: 20px;
      color: #ff8fab;
      font-weight: bold;
      margin-top: 30px;
    }

    .tips {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎂 生日贺卡生成器 🎂</h1>

    <div class="input-group">
      <label>对方姓名</label>
      <input type="text" id="name" placeholder="请输入姓名" required>
    </div>

    <div class="input-group">
      <label>年龄</label>
      <input type="number" id="age" placeholder="请输入年龄" required>
    </div>

    <div class="input-group">
      <label>爱好</label>
      <input type="text" id="hobby" placeholder="例如：画画、打球、旅行" required>
    </div>

    <div class="btn-group">
      <button id="generateBtn">生成贺卡</button>
      <button id="copyBtn">复制贺卡文字</button>
    </div>
  </div>

  <!-- 生成的贺卡 -->
  <div class="card" id="card">
    <h2>生日快乐！</h2>
    <div class="card-content" id="cardText"></div>
    <div class="wish">愿你永远开心，万事顺遂！</div>
  </div>

  <script>
    // 获取元素
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const card = document.getElementById('card');
    const cardText = document.getElementById('cardText');

    // 生成贺卡
    generateBtn.addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      const age = document.getElementById('age').value.trim();
      const hobby = document.getElementById('hobby').value.trim();

      // 校验输入
      if (!name || !age || !hobby) {
        alert('请填写完整信息哦！');
        return;
      }

      // 贺卡文案
      const content = `
                亲爱的${name}：<br><br>
                祝你${age}岁生日快乐！🎊<br>
                愿你在新的一岁里，天天开心，平安健康～<br>
                希望你能一直坚持热爱的${hobby}，永远闪闪发光！
            `;

      cardText.innerHTML = content;
      card.style.display = 'block';
    });

    // 复制文字
    copyBtn.addEventListener('click', () => {
      const text = cardText.innerText;
      if (!text) {
        alert('先生成贺卡再复制哦！');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('复制成功！可以粘贴发送啦～');
      });
    });
  </script>
</body>

</html>
