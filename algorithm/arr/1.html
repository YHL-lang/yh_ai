<body>
  <script>
    //js灵活 高级脚本语言 不太想关注内存
    // [] 代表数组 {}代表对象
    //最常用的方括号+元素
    // const arr = [1, 2, 3, 4]
    // 如果不知道数组内的元素呢？
    const arr = ['a', 'b', 'c'];// 特定存储结构 一段连续的内存空间
    // 特定的行为 adt  abstract data type
    // console.log(arr.push(1));
    const arr2 = arr.push(1);
    arr.push(2);
    arr.unshift(3);
    arr.pop();
    arr.shift();
  </script>
